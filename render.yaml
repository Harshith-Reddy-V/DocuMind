# Render Blueprint Specification for DocuMind
# Documentation: https://render.com/docs/blueprint-spec
services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: documind-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_GENERATION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: VECTOR_DB_DIR
        value: ./data/chroma
      - key: DATABASE_URL
        value: sqlite:///./data/documind.db

  # 2. React + Vite Frontend Static Site
  - type: web
    name: documind-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
